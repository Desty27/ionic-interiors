<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Construction Calculator - Step 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/calculator.css" rel="stylesheet">
</head>

<body>

  <div class="top-nav">
    <div class="logo">
      <a href="index.html"><img src="assets/logo.png" alt="Ionic Interiors Logo"></a>
    </div>
    <div class="nav-steps-container">
      <div class="nav-steps">
        <div class="progress-line">
          <div class="progress-fill" style="width: 50%;"></div>
        </div>
        
        
        <div class="step active">
          <div class="circle"></div>
          <div class="label">PACKAGE</div>
        </div>
        <div class="step ">
          <div class="circle"></div>
          <div class="label">GET QUOTE</div>
        </div>
      </div>
      <div class="step-counter">1/2</div>
    </div>
  </div>

<div class="container mt-5" style="max-width: 700px;">
  <!-- Progress Bar -->

  



  <!-- Step 1 -->
  <form id="step1" method="get" action="construction_calc_step2.html" class="card  p-4 border-0 ">
    <h5 class="text-center fw-bold mb-4">Select Your Package</h5>

    <div class="package-container">
  
      <!-- Essentials -->
      <label class="package-card">
          <input type="radio" name="package" value="Essentials" class="radio-input" checked>
          <span class="radio-check"></span>
          <img src="assets/essential-construction.jpg" alt="Essentials Interior" class="package-image">
          <h3 class="package-title">Essentials (₹)</h3>
          <p class="package-description">
              Smart, durable construction for comfortable everyday living.
          </p>
          <ul class="package-features">
              <li>Cost-effective materials</li>
              <li>Functional layouts</li>
              <li>Quality finishes</li>
          </ul>
      </label>

      <!-- Premium -->
      <label class="package-card">
          <input type="radio" name="package" value="Premium" class="radio-input">
          <span class="radio-check"></span>
          <img src="assets/premium-construction.webp" alt="Premium Interior" class="package-image">
          <h3 class="package-title">Premium (₹₹)</h3>
          <p class="package-description">
              Modern construction with enhanced quality, comfort, and style.
          </p>
          <ul class="package-features">
              <li>Durable premium materials</li>
              <li>Customized design options</li>
              <li>Superior finishes</li>
          </ul>
      </label>

      <!-- Luxe -->
      <label class="package-card">
          <input type="radio" name="package" value="Luxe" class="radio-input">
          <span class="radio-check"></span>
          <img src="assets/luxury-construction.jpg" alt="Luxe Interior" class="package-image">
          <h3 class="package-title">Luxe (₹₹₹)</h3>
          <p class="package-description">
              Exclusive residences crafted with exceptional quality and elegance.
          </p>
          <ul class="package-features">
              <li>Exclusive designer finishes</li>
              <li>Bespoke luxury concepts</li>
              <li>Premium décor & detailing</li>
          </ul>
      </label>
      
    </div>

      <div class="d-flex justify-content-between mt-4 sticky-bottom bg-white py-3" style="z-index: 1020;">
        <button type="button" class="btn btn-link text-danger fw-bold" onclick="window.location.href='index.html'">BACK</button>
        <button type="submit" name="step3" class="btn butte px-4 rounded-pill fw-bold">NEXT</button>
      </div>
  </form>

  
  
</div>


  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const steps = document.querySelectorAll('.nav-steps .step');
      if (!steps.length) return;
      let last = 0;
      steps.forEach((s, i) => {
        if (s.classList.contains('active') || s.classList.contains('completed') || (s.querySelector('.circle') && s.querySelector('.circle').classList.contains('active'))) {
          last = i;
        }
      });
      const fill = document.querySelector('.progress-fill');
      if (!fill) return;
      const pct = (steps.length > 1) ? (last / (steps.length - 1)) * 100 : 0;
      fill.style.width = pct + '%';
    });


    document.querySelector("form").addEventListener("submit", function () {

    const selected =
        document.querySelector('input[name="package"]:checked');

    if (selected) {
        sessionStorage.setItem("constructionPackage", selected.value);
    }

});
  </script>

  
</body>
</html>
