
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design &amp; Planning Calculator - Step 2 | Ionic Interiors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/calculator.css" rel="stylesheet">
</head>
<body>

  <div class="top-nav">
    <div class="logo">
      <a href="index.html"><img src="assets/logo.png" alt="Ionic Interiors Logo"></a>
    </div>
    <div class="nav-steps-container">
      <div class="nav-steps">
        <div class="progress-line">
          <div class="progress-fill" style="width: 50%;"></div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">AREA</div>
        </div>
        <div class="step active">
          <div class="circle"></div>
          <div class="label">PACKAGE</div>
        </div>
        <div class="step">
          <div class="circle"></div>
          <div class="label">ESTIMATE</div>
        </div>
      </div>
      <div class="step-counter">2/3</div>
    </div>
  </div>

<div class="container mt-5" style="max-width: 700px;">

  <!-- Step 1: Area Input (hidden) -->
  <form id="step1" method="get" action="planning_calc_step-2.html" class="card p-4 border-0 hidden">
    <div class="container py-5">
      <h4 class="text-center fw-bold mb-4">Enter your property area</h4>
      <p class="text-center text-muted mb-4">Please enter the total square footage for accurate estimation.</p>
      <div class="bhk-box active" style="cursor: default;">
        <div class="d-flex align-items-center gap-3">
          <span class="material-symbols-outlined" style="font-size: 28px; color: #2596be;">square_foot</span>
          <div class="flex-grow-1">
            <label for="planning_area" class="form-label fw-bold mb-1">Square Footage (sq.ft)</label>
            <input type="number" class="form-control py-2 px-3" id="planning_area" name="planning_area" placeholder="e.g. 1200" min="100" max="50000" required style="border: 1px solid #e0e0e0; border-radius: 8px;">
          </div>
        </div>
      </div>
      <div class="mt-4 p-3 rounded-3" style="background: #f0f8ff; border: 1px solid #d0e8f7;">
        <small class="text-muted">
          <strong>Tip:</strong> Enter the total built-up area of your property. This helps us calculate accurate pricing for floor plans, elevations, and structural drawings.
        </small>
      </div>
    </div>
    <div class="d-flex justify-content-end mt-4 sticky-bottom bg-white py-3" style="z-index: 1020;">
      <button type="submit" name="step1" class="btn butte px-4 rounded-pill fw-bold">NEXT</button>
    </div>
  </form>

  <!-- Step 2: Package Selection -->
  <form id="step2" method="get" action="planning_calc_step-3.html" class="card p-4 border-0">
    <h5 class="text-center fw-bold mb-4">Select Your Package</h5>
    <div class="package-container">
      <label class="package-card">
        <input type="radio" name="planning_package" value="Basic" class="radio-input" checked>
        <span class="radio-check"></span>
        <h3 class="package-title">Basic</h3>
        <p class="package-description">Essential architectural drawings for standard residential projects.</p>
        <ul class="package-features">
          <li>Floor plan</li>
          <li>Footer &amp; column layout</li>
          <li>Furniture layout</li>
          <li>3 side elevations</li>
        </ul>
      </label>
      <label class="package-card">
        <input type="radio" name="planning_package" value="Pro" class="radio-input">
        <span class="radio-check"></span>
        <h3 class="package-title">Pro</h3>
        <p class="package-description">Comprehensive structural and MEP drawings for complete project execution.</p>
        <ul class="package-features">
          <li>Floor plan</li>
          <li>Furniture layout</li>
          <li>Structural drawing</li>
          <li>Electrical drawing</li>
          <li>Plumbing drawing</li>
          <li>Civil work drawing</li>
          <li>All side elevation drawing</li>
        </ul>
      </label>
    </div>
    <div class="d-flex justify-content-between mt-4 sticky-bottom bg-white py-3" style="z-index: 1020;">
      <button type="button" class="btn btn-link text-danger fw-bold" onclick="window.location.href='planning_calc_step-1.html'">BACK</button>
      <button type="submit" name="step2" class="btn butte px-4 rounded-pill fw-bold">NEXT</button>
    </div>
  </form>

</div>

<script>
  // --- SESSION STORAGE SAVER ---
  document.addEventListener("DOMContentLoaded", function () {
    const forms = document.querySelectorAll("form");

    forms.forEach(form => {
      form.addEventListener("submit", function () {
        const inputs = form.querySelectorAll("input[name], select[name]");

        inputs.forEach(input => {
          if ((input.type === "radio" || input.type === "checkbox") && !input.checked) {
            return;
          }
          sessionStorage.setItem(input.name, input.value);
        });
      });
    });

    const allInputs = document.querySelectorAll("input[name], select[name]");
    allInputs.forEach(input => {
      const savedValue = sessionStorage.getItem(input.name);
      if (savedValue) {
        if (input.type === "radio" || input.type === "checkbox") {
          if (input.value === savedValue) {
            input.checked = true;
            const customBox = input.closest('.bhk-box, .layout-card, .package-card');
            if (customBox) customBox.classList.add('active', 'selected');
          }
        } else if (input.type !== "hidden") {
          input.value = savedValue;
        }
      }
    });
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const steps = document.querySelectorAll('.nav-steps .step');
    if (!steps.length) return;
    let last = 0;
    steps.forEach((s, i) => {
      if (s.classList.contains('active') || s.classList.contains('completed') || (s.querySelector('.circle') && s.querySelector('.circle').classList.contains('active'))) {
        last = i;
      }
    });
    const fill = document.querySelector('.progress-fill');
    if (!fill) return;
    const pct = (steps.length > 1) ? (last / (steps.length - 1)) * 100 : 0;
    fill.style.width = pct + '%';
  });
</script>
</body>
</html>
