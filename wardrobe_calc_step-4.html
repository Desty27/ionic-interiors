<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wardrobe Calculator - Material</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/calculator.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="logo">
      <a href="index.html"><img src="assets/logo.png" alt="Ionic Interiors Logo"></a>
    </div>
    
    <div class="nav-steps-container">
      <div class="nav-steps">
        <div class="progress-line">
          <div class="progress-fill" style="width: 60%;"></div>
        </div>
        
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">LENGTH</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">TYPE</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">FINISH</div>
        </div>
        <div class="step active">
          <div class="circle"></div>
          <div class="label">MATERIAL</div>
        </div>
        <div class="step">
          <div class="circle"></div>
          <div class="label">ACCESSORIES</div>
        </div>
        <div class="step">
          <div class="circle"></div>
          <div class="label">GET QUOTE</div>
        </div>
      </div>
      <div class="step-counter">4/6</div>
    </div>
  </div>

  <div class="container mt-5" style="max-width: 700px;">
    <form id="step4" method="get" action="wardrobe_calc_step-5.html" class="card border-0 p-4 shadow-sm" style="border-radius: 12px;">
      
      <div class="header mb-4">
        <h4 class="fw-bold text-dark">Select your preferred core material</h4>
      </div>

      <div class="alert-banner mx-auto" style="max-width: 450px;">
        Your core material options will be dependent on the finish you have chosen.
      </div>

      <div class="options-container mx-auto mt-4" style="max-width: 450px;">
        
        <!-- MDF -->
        <label class="package-card mb-3 text-start">
          <input type="radio" name="wardrobe_material" value="MDF" class="radio-input" required>
          
          <div class="d-flex align-items-start mb-2">
            <div class="inline-radio mb-0">
              <span class="radio-circle"></span>
              <strong>MDF</strong>
            </div>
          </div>
          <p class="text-muted small mb-3 ms-4" style="padding-left: 6px;">
            Seamless, free of knots, and has high resistance to wear & tear.
          </p>
          
          <img src="assets/MDF.jpg" alt="MDF Material" class="package-image mb-2" style="height: 120px;">
          
          <table class="details-table">
            <tr>
              <td>Price</td>
              <td>: ₹₹</td>
            </tr>
            <tr>
              <td>Pro Tip</td>
              <td>: An ideal choice for the cabinets owing to its smooth surface.</td>
            </tr>
          </table>
        </label>

        <!-- HDF/HMR -->
        <label class="package-card mb-3 text-start">
          <input type="radio" name="wardrobe_material" value="HDF_HMR" class="radio-input" checked>
          
          <div class="d-flex align-items-start mb-2">
            <div class="inline-radio mb-0">
              <span class="radio-circle"></span>
              <strong>HDF/HMR</strong>
            </div>
          </div>
          <p class="text-muted small mb-3 ms-4" style="padding-left: 6px;">
            Sturdy and highly dense along with a solid screw-holding capacity.
          </p>
          
          <img src="assets/hdf.jpg" alt="HDF Material" class="package-image mb-2" style="height: 120px;">
          
          <table class="details-table">
            <tr>
              <td>Price</td>
              <td>: ₹₹₹</td>
            </tr>
            <tr>
              <td>Pro Tip</td>
              <td>: A good option that comes with a high load-bearing capacity.</td>
            </tr>
          </table>
        </label>

      </div>

      <div class="d-flex justify-content-between mt-4 sticky-bottom bg-white py-3" style="z-index: 1020;">
        <button type="button" class="btn btn-back fw-bold px-0" onclick="window.location.href='wardrobe_calc_step-3.html'">BACK</button>
        <button type="submit" class="btn btn-next px-5 rounded-pill fw-bold">NEXT</button>
      </div>

    </form>
  </div>

</body>
</html>
