<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wardrobe Calculator - Get Quote</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/calculator.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="logo">
      <a href="index.html"><img src="assets/logo.png" alt="Ionic Interiors Logo"></a>
    </div>
    
    <div class="nav-steps-container">
      <div class="nav-steps">
        <div class="progress-line">
          <div class="progress-fill" style="width: 100%;"></div>
        </div>
        
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">LENGTH</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">TYPE</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">FINISH</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">MATERIAL</div>
        </div>
        <div class="step completed">
          <div class="circle"></div>
          <div class="label">ACCESSORIES</div>
        </div>
        <div class="step active">
          <div class="circle"></div>
          <div class="label">GET QUOTE</div>
        </div>
      </div>
      <div class="step-counter">6/6</div>
    </div>
  </div>

  <div class="container mt-5" style="max-width: 600px;">
    <form id="step6" method="post" action="submit_wardrobe_quote.php" class="card border-0 p-4 shadow-sm" style="border-radius: 12px;">
      
      <div class="header mb-4">
        <h4 class="fw-bold text-dark" style="color: #2596be !important;">Your estimate is almost ready</h4>
      </div>

      <div class="mb-3 position-relative">
        <input type="text" name="name" class="form-control py-2 px-3" placeholder="Name" required style="border: 1px solid #e0e0e0; border-radius: 8px;">
      </div>

      <div class="mb-3 position-relative">
        <input type="email" name="email" class="form-control py-2 px-3" placeholder="Email ID" required style="border: 1px solid #e0e0e0; border-radius: 8px;">
      </div>

      <div class="mb-3 d-flex align-items-center position-relative" style="border: 1px solid #e0e0e0; border-radius: 8px; padding-left: 12px; overflow: hidden;">
        <span class="me-2"><img src="https://flagcdn.com/w40/in.png" alt="IN" width="20"></span>
        <input type="tel" name="phone" class="form-control border-0 py-2 px-0" placeholder="Phone number" pattern="\d{10}" maxlength="10" minlength="10" required oninput="this.value=this.value.replace(/[^0-9]/g,'');">
      </div>

      <div class="form-check mb-3 ps-0 d-flex align-items-center">
        <input class="form-check-input me-2 mt-0" name="whatsapp_updates" type="checkbox" id="whatsappUpdates" checked style="background-color: #2596be; border-color: #2596be; width: 1.2em; height: 1.2em;">
        <label class="form-check-label text-muted" for="whatsappUpdates">
          Send me updates on WhatsApp
        </label>
      </div>

      <div class="mb-3 position-relative">
        <input type="text" name="property_name" class="form-control py-2 px-3" placeholder="Property Name" style="border: 1px solid #e0e0e0; border-radius: 8px;">
      </div>

      <div class="text-muted small mt-3 text-center">
        By submitting this form, you agree to the 
        <a href="terms-and-conditions.html" class="text-decoration-none" style="color: #2596be;">Terms and Conditions</a> &
        <a href="privacy-policy.html" class="text-decoration-none" style="color: #2596be;">Privacy Policy</a>.
      </div>

      <div class="d-flex justify-content-between mt-4 sticky-bottom bg-white py-3" style="z-index: 1020; border-top: 1px solid #f0f0f0;">
        <button type="button" class="btn btn-outline-secondary px-4 fw-bold" onclick="window.location.href='wardrobe_calc_step-5.html'" style="border-radius: 8px;">
          BACK
        </button>
        <button type="submit" class="btn px-5 fw-bold text-white" style="background: #2596be; border-radius: 8px;">
          SUBMIT
        </button>
      </div>

    </form>
  </div>

</body>
</html>
